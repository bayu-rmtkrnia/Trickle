[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
# Monad supports Cancun opcodes; pin it so local tests match the testnet.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64

[rpc_endpoints]
# Public endpoint, not a secret. Pass --rpc-url <url> to use a dedicated RPC instead.
monad_testnet = "https://testnet-rpc.monad.xyz"

[fmt]
line_length = 100

[lint]
# Streams are time-based by design; a validator nudging the timestamp by a few seconds
# moves at most a few seconds of salary.
exclude_lints = ["block-timestamp"]
