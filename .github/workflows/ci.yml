name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, typecheck, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trickle
          POSTGRES_PASSWORD: trickle
          POSTGRES_DB: trickle_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U trickle"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://trickle:trickle@localhost:5432/trickle_test
      DATABASE_URL: postgresql://trickle:trickle@localhost:5432/trickle_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm --filter @trickle/api db:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: OpenAPI spec is up to date
        run: |
          pnpm --filter @trickle/api openapi
          npx prettier --write apps/api/openapi.json
          git diff --exit-code apps/api/openapi.json

  contracts:
    name: Contracts (forge test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - id: check
        run: echo "present=$([ -f contracts/foundry.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.present == 'true'
        uses: foundry-rs/foundry-toolchain@v1
      - if: steps.check.outputs.present == 'true'
        run: forge test -vvv
        working-directory: contracts

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
