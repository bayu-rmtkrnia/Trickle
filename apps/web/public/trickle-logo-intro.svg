<svg xmlns="http://www.w3.org/2000/svg" width="193" height="49" viewBox="0 0 193 49" fill="none" role="img" aria-label="Trickle">
<title>Trickle</title>
<style>
.fl,.lt{fill:#836EF9}
.st{display:none;fill:none;stroke:#836EF9;stroke-width:3.9;stroke-dasharray:73.3 73.3}
@media (prefers-reduced-motion: no-preference){
  .st{display:inline;stroke-dashoffset:73.3;
    animation:draw 1.1s cubic-bezier(0.45,0.05,0.25,1) var(--d) both,
              gone 1ms steps(1,end) calc(var(--d) + 1.1s) forwards}
  .fl{opacity:0;animation:show 1ms steps(1,end) calc(var(--d) + 1.1s) forwards}
  .slide{animation:slide 0.9s cubic-bezier(0.65,0,0.25,1) 1.5s both}
  .lt{animation:letter 0.45s cubic-bezier(0.2,0.8,0.2,1) var(--d) both}
}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes gone{to{opacity:0}}
@keyframes show{to{opacity:1}}
@keyframes slide{from{transform:translateX(65.15px)}to{transform:translateX(0)}}
@keyframes letter{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
</style>
